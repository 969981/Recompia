# Fails a pull request whose diff, commit messages or title/body carry session trailers/links, LAN IPs or user-profile paths.
# Extra private names/hostnames come from the PUBLIC_NAMING_PATTERNS secret (one regex per line); they are not kept in the repo.
name: Public text

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Scan
        env:
          PUBLIC_NAMING_PATTERNS: ${{ secrets.PUBLIC_NAMING_PATTERNS }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE: origin/${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 .github/scripts/public_text_check.py "$BASE" "$HEAD_SHA"
