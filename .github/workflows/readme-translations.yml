# Checks the translated READMEs (docs/i18n/README.<lang>.md and game-build/release_b/README.linux.<lang>.txt) with
# tools/i18n/check_readmes.py: a translation whose structure differs from the English file (headings, code blocks, links, file
# names, options) or that has no source-sha256 line fails; a translation made from an older English file only shows a warning,
# so editing the English README never blocks a pull request. No publish.
name: README translations

on:
  pull_request:
    paths:
      - 'README.md'
      - 'game-build/release_b/README.linux*.txt'
      - 'docs/i18n/**'
      - 'tools/i18n/**'
      - '.github/workflows/readme-translations.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check the translations
        run: python3 tools/i18n/check_readmes.py
