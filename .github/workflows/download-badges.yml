# Download totals for the README badges: counts the Windows and Linux files of every release (stable and Testing builds apart or
# together, see .github/scripts/download-badges.sh) and publishes small JSON files that shields.io reads (an orphan `badges` branch
# with one commit, replaced on every run).
# A release made by the release workflow does not start `release` workflows (GitHub does not chain runs started with its own token),
# so this also follows the Release workflow finishing, and runs every six hours as a safety net.
name: Download badges

on:
  release:
    types: [published, deleted]
  workflow_run:
    workflows: [Release]
    types: [completed]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: download-badges
  cancel-in-progress: false

jobs:
  badges:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts
      - name: Add up the downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate | jq -s 'add // []' > releases.json
          .github/scripts/download-badges.sh releases.json out
      - name: Publish to the badges branch
        run: |
          cd out
          git init -q -b badges
          git config user.name "github-actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "Download totals"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:badges
