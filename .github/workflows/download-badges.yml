# Download totals per platform for the README badges: adds up every release's Windows and Linux files and publishes two small
# JSON files that shields.io reads (an orphan `badges` branch with one commit, replaced on every run).
name: Download badges

on:
  release:
    types: [published, deleted]
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  badges:
    runs-on: ubuntu-latest
    steps:
      - name: Add up the downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases" --paginate > releases.json
          node --test .github/scripts/download-badges.test.mjs
          node .github/scripts/download-badges.mjs releases.json out
          test -s out/win64.json
          test -s out/linux-x64.json
      - name: Publish to the badges branch
        run: |
          cd out
          git init -q -b badges
          git config user.name "github-actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "Download totals"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:badges
