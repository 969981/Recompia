name: Bug report
description: Something is wrong in the game or the launcher.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did and what happened, and where in the game.
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit you built
      placeholder: e.g. a1b2c3d
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: GPU, driver and Windows version
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: pkp.log
      description: Drag in pkp.log from the session where it happened.
